# =============================================================================
# SelfVault - Développement Local (100% Auto-Hébergé)
# =============================================================================
#
# Stack complète pour développement local:
# - PostgreSQL (base de données)
# - MinIO (stockage S3-compatible)
# - Backend Express (hot-reload)
# - Frontend React/Vite (hot-reload)
#
# DÉMARRAGE RAPIDE:
# -----------------
# 1. cp .env.example .env
# 2. docker compose up -d
# 3. Ouvrir http://localhost:5173
#
# ACCÈS:
# ------
# - Frontend:      http://localhost:5173
# - Backend API:   http://localhost:8080
# - MinIO Console: http://localhost:9001 (minioadmin / minioadmin123)
# - PostgreSQL:    localhost:5432
#
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: selfvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selfvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfvault123}
      POSTGRES_DB: ${POSTGRES_DB:-selfvault}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - selfvault-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selfvault} -d ${POSTGRES_DB:-selfvault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MinIO - Stockage S3-compatible
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: selfvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    volumes:
      - minio-data:/data
    networks:
      - selfvault-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Initialisation du Bucket MinIO
  # ===========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: selfvault-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set selfvault http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb selfvault/$${S3_BUCKET:-selfvault} --ignore-existing;
      mc anonymous set none selfvault/$${S3_BUCKET:-selfvault};
      echo '✅ Bucket créé avec succès';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-selfvault}
    networks:
      - selfvault-network

  # ===========================================================================
  # Migrations Base de Données
  # ===========================================================================
  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: selfvault-migrations
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-selfvault}:${POSTGRES_PASSWORD:-selfvault123}@postgres:5432/${POSTGRES_DB:-selfvault}
      DIRECT_URL: postgresql://${POSTGRES_USER:-selfvault}:${POSTGRES_PASSWORD:-selfvault123}@postgres:5432/${POSTGRES_DB:-selfvault}
    command: sh -c "npx prisma migrate deploy && npx prisma generate"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - selfvault-network

  # ===========================================================================
  # Backend API (Développement avec hot-reload)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: selfvault-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      # === Authentification ===
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-minimum-32-characters-long}
      # === Base de données ===
      DATABASE_URL: postgresql://${POSTGRES_USER:-selfvault}:${POSTGRES_PASSWORD:-selfvault123}@postgres:5432/${POSTGRES_DB:-selfvault}
      DIRECT_URL: postgresql://${POSTGRES_USER:-selfvault}:${POSTGRES_PASSWORD:-selfvault123}@postgres:5432/${POSTGRES_DB:-selfvault}
      # === Stockage MinIO ===
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-selfvault}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_FORCE_PATH_STYLE: "true"
      # === Limites ===
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-104857600}
      MAX_STORAGE_PER_USER_BYTES: ${MAX_STORAGE_PER_USER_BYTES:-5368709120}
      # === CORS ===
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      # === Supabase (si AUTH_PROVIDER=supabase) ===
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
    networks:
      - selfvault-network
    command: npm run dev

  # ===========================================================================
  # Frontend (Développement avec hot-reload)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: selfvault-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - selfvault-network

# =============================================================================
# Volumes Persistants
# =============================================================================
volumes:
  postgres-data:
  minio-data:
  backend-node-modules:
  frontend-node-modules:

# =============================================================================
# Réseau
# =============================================================================
networks:
  selfvault-network:
    driver: bridge
